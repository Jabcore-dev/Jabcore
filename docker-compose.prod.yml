# Jabcore — produkční stack. Server potřebuje jen Docker.
#
#   db    PostgreSQL 17        (stateful, nepublikuje port)
#   web   Next.js standalone   (jabcore.cz i portfolio.jabcore.cz, rozlišuje middleware)
#
# Nespouštět ručně: `./build.sh <prostředí>` vybere prostředí
# (deploy/<env>.env + deploy/secrets.<env>.env), spustí migrace a vyexportuje
# všechno níž. Přímé volání compose spadne zpátky na localhost defaulty a
# nastartovalo by produkci proti prázdnému heslu.
#
# Proměnné, které exportuje build.sh:
#   STACK_PREFIX BIND_ADDRESS WEB_PORT SECRETS_FILE
#   PUBLIC_BASE_URL PORTFOLIO_BASE_URL ENVIRONMENT
#   POSTGRES_PASSWORD APP_VERSION BUILD_COMMIT BUILD_TIME

# Logy kontejnerů jsou defaultně neomezené, což na dlouho běžícím serveru
# znamená, že za pár měsíců bezdůvodně dojde disk. Každá služba je stropuje.
x-logging: &logging
  driver: json-file
  options:
    max-size: "10m"
    max-file: "5"

services:
  db:
    image: postgres:17-alpine
    container_name: ${STACK_PREFIX:-jabcore}-db
    restart: unless-stopped
    logging: *logging
    environment:
      POSTGRES_DB: jabcore
      POSTGRES_USER: jabcore
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD není nastavené — spusť ./build.sh, ne compose přímo}
    # Bez publikovaného portu záměrně: databáze je dosažitelná jen z compose
    # sítě. Zálohy jdou přes `docker exec` (viz deploy/backup.sh).
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U jabcore -d jabcore']
      interval: 5s
      timeout: 5s
      retries: 10

  web:
    build:
      context: .
      dockerfile: Dockerfile
      args:
        NEXT_PUBLIC_SITE_URL: ${PUBLIC_BASE_URL:?chybí PUBLIC_BASE_URL v deploy/<env>.env}
        NEXT_PUBLIC_PORTFOLIO_URL: ${PORTFOLIO_BASE_URL:?chybí PORTFOLIO_BASE_URL v deploy/<env>.env}
        NEXT_PUBLIC_SITE_ENV: ${ENVIRONMENT:?chybí ENVIRONMENT}
    image: jabcore-web:${ENVIRONMENT:-production}
    container_name: ${STACK_PREFIX:-jabcore}-web
    restart: unless-stopped
    logging: *logging
    # AUTH_SECRET a heslo k databázi. Žije na serveru, nikdy v gitu —
    # viz deploy/README.md.
    env_file:
      - ${SECRETS_FILE:-.env}
    environment:
      # Přebíjí, co říká secrets soubor: k databázi se chodí jen přes compose
      # síť a heslo je to, které compose právě předal službě db.
      DATABASE_URL: postgresql://jabcore:${POSTGRES_PASSWORD}@db:5432/jabcore
      NODE_ENV: production
      PORT: 3000
      HOSTNAME: 0.0.0.0
      NEXT_PUBLIC_SITE_URL: ${PUBLIC_BASE_URL}
      NEXT_PUBLIC_PORTFOLIO_URL: ${PORTFOLIO_BASE_URL}
      NEXT_PUBLIC_SITE_ENV: ${ENVIRONMENT}
      # Identita buildu, kterou servíruje /api/health — aby se deploy dal ověřit
      # zvenku místo předpokládání.
      APP_VERSION: ${APP_VERSION:-unknown}
      BUILD_COMMIT: ${BUILD_COMMIT:-unknown}
      BUILD_TIME: ${BUILD_TIME:-unknown}
    depends_on:
      db:
        condition: service_healthy
    volumes:
      # Nahrané obrázky referencí. Mimo image, takže přežijí redeploy.
      - uploads:/app/public/uploads
    ports:
      # Jen loopback. Ven všechno pouští reverse proxy, která terminuje TLS;
      # publikace na 0.0.0.0 by web vystavila po HTTP na veřejné IP serveru.
      - "${BIND_ADDRESS:-127.0.0.1}:${WEB_PORT:-3000}:3000"
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1:3000/api/health"]
      interval: 30s
      timeout: 5s
      retries: 5
      start_period: 20s

  # Jednorázový migrátor. Nestartuje se s ostatními službami (profil "tools"),
  # spouští ho build.sh jako `run --rm` před výměnou web kontejneru.
  migrate:
    profiles: ["tools"]
    build:
      context: .
      dockerfile: Dockerfile
      target: migrator
    image: jabcore-migrate:${ENVIRONMENT:-production}
    container_name: ${STACK_PREFIX:-jabcore}-migrate
    logging: *logging
    environment:
      DATABASE_URL: postgresql://jabcore:${POSTGRES_PASSWORD}@db:5432/jabcore
    depends_on:
      db:
        condition: service_healthy

volumes:
  pgdata:
  uploads:
